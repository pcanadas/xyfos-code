name: Deploy (xyfos.com via SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-xyfos-com
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy dist/ -> xyfos.com/public_html (preserving existing folders)
        run: |
          # public_html is shared with the subdomains (quotedesk, zentask, salesops...).
          # Known folders are excluded explicitly, and the "P /*/" rule protects any other
          # top-level folder that is not part of dist/, so a new subdomain is never wiped.
          # --itemize-changes logs every "*deleting" line so deletions show up in the Actions log.
          rsync -az --delete --itemize-changes \
            --filter "P /*/" \
            --exclude "/apps" \
            --exclude "/quotedesk" \
            --exclude "/zentask" \
            --exclude "/zentask-app" \
            --exclude "/salesops" \
            --exclude "salesops-app/" \
            --exclude "ftp.xyfos.com/" \
            --exclude "pub/" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            dist/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_REMOTE_PATH }}